# Shared toolchain for the unit tests: Python deps, plus Node for the jsii
# runtime used by the Python CDK library.
name: Set up test toolchain
description: Python + requirements-dev.txt, Node

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: "3.13"
        cache: pip
        cache-dependency-path: requirements*.txt

    - uses: actions/setup-node@v7
      with:
        node-version: "24"

    - name: Install Python deps
      shell: bash
      run: |
        python -m pip install --quiet --upgrade pip
        python -m pip install --quiet -r requirements-dev.txt
        mkdir -p reports
