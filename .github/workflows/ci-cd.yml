# CI for KafkaSimpleCdkStack (single-node KRaft Kafka on EC2).
#
#   build    install -> unit tests
#
# Runs on pull requests into main, pushes to main, and manual runs. It needs
# no AWS credentials: the tests synthesize offline from cdk.context.json.
# Deploys and tear-downs are done by hand (see the README).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Unit tests
        run: python -m pytest -v --junitxml=reports/junit.xml

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: reports/
          if-no-files-found: ignore
