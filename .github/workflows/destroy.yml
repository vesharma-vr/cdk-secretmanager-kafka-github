# Tears down KafkaSimpleCdkStack. Manual only, main only, and gated twice:
# the caller must type the stack name, and the "production" environment's
# required reviewers must approve the job.
name: Destroy

on:
  workflow_dispatch:
    inputs:
      confirm_stack_name:
        description: Type KafkaSimpleCdkStack to confirm.
        type: string
        required: true
      force_delete_secret:
        description: Also purge the broker secret now instead of leaving it in its 30-day recovery window (lets you redeploy immediately).
        type: boolean
        default: false

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_DEFAULT_REGION: us-east-1
  STACK_NAME: KafkaSimpleCdkStack
  SECRET_NAME: kafka-simple-cdk-broker-credentials

jobs:
  confirm:
    name: Confirm destroy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check branch and confirmation
        env:
          TYPED: ${{ inputs.confirm_stack_name }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Destroy only runs from main (got $GITHUB_REF)."
            exit 1
          fi
          if [ "$TYPED" != "$STACK_NAME" ]; then
            echo "::error::Confirmation '$TYPED' does not match $STACK_NAME; nothing destroyed."
            exit 1
          fi

  destroy:
    name: Destroy
    needs: confirm
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    concurrency:
      group: cfn-KafkaSimpleCdkStack-us-east-1
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: cdk destroy
        run: |
          cdk destroy "$STACK_NAME" --force
          status=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
              --query 'Stacks[0].StackStatus' --output text 2>/dev/null || echo GONE)
          echo "Stack status after destroy: $status"
          case "$status" in GONE|DELETE_COMPLETE) ;; *) exit 1 ;; esac

      # See README "Secrets Manager gotcha": the fixed secret name stays
      # reserved for 30 days unless purged.
      - name: Purge broker secret
        if: inputs.force_delete_secret
        run: |
          aws secretsmanager delete-secret --secret-id "$SECRET_NAME" \
              --force-delete-without-recovery \
          || echo "Secret $SECRET_NAME not found -- nothing to purge."
